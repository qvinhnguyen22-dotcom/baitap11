<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<div layout:fragment="content" class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Đăng Nhập</h2>
                    <p class="text-muted small">Chào mừng bạn quay trở lại với BookStore</p>
                </div>

                <!-- Alert Thông Báo Lỗi / Thành Công -->
                <div th:if="${error != null}" class="alert alert-danger border-0 rounded-3 py-2 small mb-3">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                </div>
                <div th:if="${message != null}" class="alert alert-success border-0 rounded-3 py-2 small mb-3">
                    <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${message}"></span>
                </div>

                <form action="/login" method="post">
                    <!-- Email với icon -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Địa chỉ Email:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted">
                                <i class="bi bi-envelope-fill"></i>
                            </span>
                            <input type="email" name="email" class="form-control bg-light border-start-0 rounded-end-3 py-2" placeholder="admin@gmail.com hoặc user@gmail.com" required>
                        </div>
                    </div>

                    <!-- Mật khẩu với icon -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Mật khẩu:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted">
                                <i class="bi bi-key-fill"></i>
                            </span>
                            <input type="password" name="password" class="form-control bg-light border-start-0 rounded-end-3 py-2" placeholder="Nhập mật khẩu của bạn" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient-primary w-100 py-2 fs-6 rounded-pill mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập
                    </button>

                    <div class="text-center pt-2 border-top">
                        <span class="small text-muted">Chưa có tài khoản?</span>
                        <a href="/register" class="small fw-bold text-decoration-none ms-1">Đăng ký tài khoản ngay</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</html>
