<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<div layout:fragment="content" class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white text-center">
                <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem; background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h2 class="fw-bold mb-1">Xác Thực Mã OTP</h2>
                <p class="text-muted small mb-3">
                    Mã xác nhận 6 số đã được gửi qua email: <br>
                    <strong class="text-primary" th:text="${email}"></strong>
                </p>

                <!-- Lỗi nếu có -->
                <div th:if="${error != null}" class="alert alert-danger border-0 rounded-3 py-2 small mb-3 text-start">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                </div>

                <form action="/verify-otp" method="post">
                    <input type="hidden" name="email" th:value="${email}">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary text-start d-block">Nhập mã OTP (6 số):</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="text" name="otp" class="form-control bg-light border-start-0 rounded-end-3 py-2 text-center fs-4 fw-bold letter-spacing-2" placeholder="••••••" maxlength="6" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fs-6 rounded-pill mb-3" style="background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); border: none;">
                        <i class="bi bi-check-circle me-1"></i> Xác Minh & Kích Hoạt
                    </button>

                    <a href="/login" class="small text-muted text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Quay lại trang Đăng nhập
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
</html>
