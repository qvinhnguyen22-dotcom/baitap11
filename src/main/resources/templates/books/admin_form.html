<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<div layout:fragment="content" class="py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="d-flex align-items-center justify-content-between pb-3 mb-4 border-bottom">
                    <div>
                        <span class="badge bg-primary text-white rounded-pill px-3 py-1 small fw-bold mb-1">
                            <i class="bi bi-pencil-square"></i> BIỂU MẪU SÁCH
                        </span>
                        <h3 class="fw-bold mb-0 text-dark" th:text="${book.bookid != null ? 'Cập Nhật Sách #' + book.bookid : 'Thêm Sách Mới Vào Kho'}"></h3>
                    </div>
                    <a href="/admin/books" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left"></i> Quay lại
                    </a>
                </div>

                <form action="/admin/books/save" method="post" enctype="multipart/form-data" th:object="${book}">
                    <input type="hidden" th:field="*{bookid}">
                    <input type="hidden" th:field="*{coverImage}">

                    <!-- Tiêu đề sách -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Tiêu đề Sách:</label>
                        <input type="text" th:field="*{title}" class="form-control rounded-3 py-2" placeholder="Ví dụ: Lập trình Spring Boot từ cơ bản đến nâng cao" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <!-- ISBN -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Mã ISBN:</label>
                            <input type="number" th:field="*{isbn}" class="form-control rounded-3 py-2" placeholder="Ví dụ: 1005" required>
                        </div>
                        <!-- Nhà xuất bản -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Nhà xuất bản:</label>
                            <input type="text" th:field="*{publisher}" class="form-control rounded-3 py-2" placeholder="Ví dụ: NXB Trẻ">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <!-- Giá bán -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Giá bán (VNĐ):</label>
                            <div class="input-group">
                                <input type="number" step="0.01" th:field="*{price}" class="form-control rounded-start-3 py-2" placeholder="Ví dụ: 150000" required>
                                <span class="input-group-text rounded-end-3 bg-light">VNĐ</span>
                            </div>
                        </div>
                        <!-- Số lượng trong kho -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Số lượng trong kho:</label>
                            <input type="number" th:field="*{quantity}" class="form-control rounded-3 py-2" placeholder="Ví dụ: 50" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <!-- Ngày xuất bản -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Ngày xuất bản:</label>
                            <input type="date" th:field="*{publishDate}" class="form-control rounded-3 py-2">
                        </div>

                        <!-- Tác giả -->
                        <div class="col-md-6" th:if="${authors != null and !authors.isEmpty()}">
                            <label class="form-label small fw-bold text-secondary">Tác giả liên quan:</label>
                            <select th:field="*{authors}" class="form-select rounded-3" multiple size="3">
                                <option th:each="a : ${authors}" th:value="${a.authorId}" th:text="${a.authorName}"></option>
                            </select>
                            <small class="text-muted" style="font-size: 0.75rem;">Giữ phím Ctrl (hoặc Cmd) để chọn nhiều tác giả</small>
                        </div>
                    </div>

                    <!-- Mô tả -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Mô tả tóm tắt nội dung:</label>
                        <textarea th:field="*{description}" rows="4" class="form-control rounded-3" placeholder="Nhập tóm tắt nội dung, thông điệp cuốn sách..."></textarea>
                    </div>

                    <!-- Ảnh bìa -->
                    <div class="mb-4 p-3 border rounded-3 bg-light">
                        <label class="form-label small fw-bold text-secondary d-block">Ảnh bìa sách (Cover Image):</label>
                        <div th:if="${book.coverImage != null and !book.coverImage.isEmpty()}" class="d-flex align-items-center gap-3 mb-2">
                            <img th:src="@{'/uploads/covers/' + ${book.coverImage}}" width="70" height="95" class="rounded-3 shadow-sm border" style="object-fit:cover;">
                            <div>
                                <small class="text-muted d-block">Ảnh hiện tại:</small>
                                <span class="badge bg-secondary" th:text="${book.coverImage}"></span>
                            </div>
                        </div>
                        <input type="file" name="file" class="form-control rounded-3" accept="image/*">
                        <small class="text-muted">Chọn file ảnh nếu muốn cập nhật hoặc tải lên ảnh mới</small>
                    </div>

                    <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                        <a href="/admin/books" class="btn btn-light rounded-pill px-4">Hủy bỏ</a>
                        <button type="submit" class="btn btn-gradient-primary rounded-pill px-4">
                            <i class="bi bi-cloud-arrow-up-fill me-1"></i> Lưu Thông Tin Sách
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</html>
